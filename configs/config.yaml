defaults:
  - data: ogb_dataset
  - model: gcn
  - _self_

training:
  lr: 0.001
  epochs: 20
  batch_size: 32
  optimizer: adam
  to_undirected: true
  seed: 42
  val_size: 0.1
  test_size: 0.1

meta:
  owner_initials: "mo"

wandb:
  project: "politechnika-gnn-thesis"
  entity: "politechnika-gnn-thesis"
  run_name: "${meta.owner_initials}_${model.name}_${data.name}_${data.target}_${data.dataset.scenario}_ep${training.epochs}"