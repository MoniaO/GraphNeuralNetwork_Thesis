# Task A — link prediction on GSN v3.
# Model must be selected explicitly at runtime (model=hgt_fusion88).
# W&B project/entity below must stay unchanged.

defaults:
  - data: dataset_v3
  - model: null
  - hcr: none
  - _self_

training:
  lr: 0.001
  epochs: 100
  optimizer: adam
  seed: 20260721
  weight_decay: 0.0005
  device: auto
  batch_size: 32

  eval_per_endpoint: false
  selection_metric: auprc
  auto_threshold: true
  eval_threshold: 0.5

  early_stopping_patience: 20
  early_stopping_min_delta: 0.0

  track_oversmoothing: true
  oversmoothing_sample_size: 2000
  oversmoothing_excluded_models:
    - linear

  grad_clip: 0.0

meta:
  owner_initials: "MJ"

experiment:
  wave: FINAL_14.08.2026
  variant: none
  description: ""
  intervention: none
  relation_ablation:
    enabled: false
    removed_relations: []
  motif_completion:
    enabled: false
    hide: parent_a
  latent_gate:
    enabled: false
  causal_role_audit:
    enabled: false
  context_selection:
    mode: structural
    source_graph: train
    use_true_graph: false

wandb:
  project: "politechnika-gnn-thesis"
  entity: "politechnika-gnn-thesis"
  enabled: true
  group: TaskA_FINAL_14_08_2026
  job_type: training
  tags:
    - TaskA
    - FINAL
    - v3
