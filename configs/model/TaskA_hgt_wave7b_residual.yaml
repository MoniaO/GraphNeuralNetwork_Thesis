# Wave 7 Panel B residual fusion — frozen HGT + residual decoder head.
name: hgt
conv_type: hgt
encoder_name: hgt

hidden_channels: 32
hidden_dim: 32
num_layers: 3
heads: 8
dropout: 0.2
residual: true
activation: leaky_relu

hgt:
  hidden_dim: 32
  num_layers: 3
  heads: 8
  activation: leaky_relu
  dropout: 0.2
  residual: true
  norm: layernorm

decoder:
  name: residual_fusion
  dropout: 0.2
  hcr_dim: 120
  # overridden per variant in hcr yaml / experiment.variant
  use_legacy_residual: false
  legacy_mode: none
  use_triple: false
