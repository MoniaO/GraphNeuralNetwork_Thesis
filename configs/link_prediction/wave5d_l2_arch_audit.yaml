# WAVE 5D — L2_structural_hcr architecture audit (clean only)

experiment:
  task: TaskA_link_prediction
  wave: WAVE5D_ARCH_AUDIT
  variant: L2_structural_hcr
  arch_tag: baseline

data:
  scenario: clean
  candidate_registry: outputs/wave5d_link/candidates/frozen_candidates.csv
  use_frozen_candidates: true
  candidate_seed: 20260722

hcr:
  enabled: true
  representation: structural_latent_pairwise_aby
  variant: structural_latent_pairwise
  dimension: 24
  output_dim: 24
  use_gate_column: false
  recompute_per_run: false
  smoothing: 0.5
  fit_split: train

model:
  hgt:
    hidden_dim: 64
    num_layers: 1
    heads: 8
    activation: gelu
    dropout: 0.2
    residual: true
    norm: layernorm
  decoder:
    hidden_dims:
      - 64
    activation: gelu
    dropout: 0.2
    hcr_dim: 24

training:
  max_epochs: 300
  patience: 40
  checkpoint_metric: valid_auprc
  lr: 0.001
  weight_decay: 0.0005
  device: cpu

evaluation:
  architecture_selection_split: valid
  primary_metric: auprc
  use_test_for_selection: false
  target_test_auprc: 0.7338
  target_test_brier: 0.1188
  reproduce_tol_auprc: 0.01

wandb:
  enabled: true
  project: politechnika-gnn-thesis
  entity: politechnika-gnn-thesis
  group: TaskA_WAVE5D_L2_ARCH_AUDIT
  job_type: architecture_audit
  tags:
    - TaskA
    - WAVE5D
    - L2_structural_hcr
    - arch_audit

seeds_stage0:
  - 20260721
  - 20260722
  - 20260723
  - 20260724
  - 20260725

seeds_screening:
  - 20260721
  - 20260722
  - 20260723

paths:
  output_dir: outputs/taskA_arch_audit
  frozen_candidates: outputs/wave5d_link/candidates/frozen_candidates.csv
  wave5d_reference: outputs/wave5d_link/summary/per_seed_metrics.csv
