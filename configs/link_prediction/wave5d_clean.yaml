# WAVE 5D — Patient-Conditioned Path-Supported Link Prediction (clean pilot)

experiment:
  task: link_prediction
  wave: WAVE5D
  name: PATIENT_PATH_SUPPORTED_LINK_PREDICTION

wandb:
  enabled: true
  project: politechnika-gnn-thesis
  entity: politechnika-gnn-thesis
  group: TaskA_WAVE5D_PATH_LINK
  job_type: patient_path_link
  tags:
    - TaskA
    - WAVE5D
    - link_prediction
    - clean

data:
  scenario: clean

topology:
  graph_source: G_train
  always_keep_train_edges: true
  predicted_requires_topological_allowed: true
  leave_candidate_out: true

hcr:
  representation: structural_latent_pairwise_aby
  dimension: 24
  use_gate_column: false

path_support:
  patient_conditioned: true
  temperature: 0.5
  length_penalty: 0.1
  node_activity_weight: 0.0
  gate_weight: 2.0
  static_hcr_weight: 0.0
  max_patients_per_split: 32

cohort_pooling:
  method: log_mean_exp
  kappa_grid: [0.5, 1.0, 2.0, 4.0]
  # Full κ grid only for L4; other variants use default_kappa.
  default_kappa: 1.0

decoder:
  hidden_dim: 64
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.0001
  epochs: 25
  batch_edges: 256

evaluation:
  primary_metric: auprc
  report_role_fpr: true
  report_path_metrics: true

seeds:
  - 20260721
  - 20260722
  - 20260723
  - 20260724
  - 20260725

paths:
  evidence_pattern: outputs/wave5/evidence/seed{seed}_edges.csv
  wave5c_registry: outputs/wave5c/registry/edge_context_registry.csv
  output_dir: outputs/wave5d_link

variants:
  - L0_hgt
  - L1_pairwise_hcr
  - L2_structural_hcr
  - L3_path_support
  - L4_final
  - L5_patient_shuffle
  - L6_context_shuffle
  - L7_matched_random_context
  - L8_random_path_weights
  - L9_all_context_warning
  - L10_no_leave_one_out
