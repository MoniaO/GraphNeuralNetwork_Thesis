# Wave 5 Stage 1 — uniform finite-path ensemble (no HGT / HCR potentials yet)
enabled: true
name: uniform

graph:
  source: train_only
  enforce_dag: true
  endpoint_terminal: true
  candidate_threshold: null
  candidate_budget: null

path:
  top_k: 20
  temperature: 1.0
  length_penalty: 0.0
  max_hops: null

edge_potential:
  mode: uniform
  # All edges scored equally (q_uv = 0) → uniform over equal-length paths;
  # with length_penalty=0 this is uniform over all finite s→e paths.
  known_edge_probability: null

motifs:
  enabled: false

patient_context:
  enabled: false

temporal:
  enabled: false
