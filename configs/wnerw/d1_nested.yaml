# Wave 5B — D1 nested (no gate factors):
# q = α log p_HGT + β (log P_D1 − log p_HGT)
enabled: true
name: d1_nested

graph:
  source: predicted
  enforce_dag: true
  endpoint_terminal: true
  candidate_threshold: 0.50
  candidate_budget: null
  probability_column: p_d1_calibrated

path:
  top_k: 20
  temperature: 1.0
  length_penalty: 0.10
  max_hops: null

edge_potential:
  mode: d1_nested
  alpha_hgt: 1.0
  beta_hcr2: 1.0
  known_edge_probability: 0.999999
  uncertainty_penalty: 0.0
  calibration: platt

motifs:
  enabled: false

patient_context:
  enabled: false

temporal:
  enabled: false
