# Wave 5A.1 control — permute HCR probs among all predicted edges in G*.
enabled: true
name: edgewise_shuffle_global

graph:
  source: predicted
  enforce_dag: true
  endpoint_terminal: true
  candidate_threshold: 0.50
  candidate_budget: null
  probability_column: p_calibrated

path:
  top_k: 20
  temperature: 1.0
  length_penalty: 0.10
  max_hops: null

edge_potential:
  mode: nested_probabilities
  alpha_hgt: 1.0
  beta_hcr2: 1.0
  beta_hcr3: 0.0
  uncertainty_penalty: 0.0
  known_edge_probability: 0.999999
  calibration: platt
  shuffle_mode: edgewise_shuffle_global

motifs:
  enabled: false

patient_context:
  enabled: false

temporal:
  enabled: false
