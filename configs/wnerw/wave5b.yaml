# WAVE 5B — Topology–Energy Decomposition and Calibration
# Thresholds frozen from Wave 5A.1 (candidate_threshold=0.50). Do not retune.

experiment:
  name: WAVE5B_TOPOLOGY_ENERGY_DECOMPOSITION
  wave: WAVE5B

seeds:
  - 20260721
  - 20260722
  - 20260723
  - 20260724
  - 20260725

paths:
  # Actual on-disk locations (Wave 5A / 5A.1 exports).
  edge_pattern: outputs/wave5/evidence/seed{seed}_edges.csv
  patient_shuffle_pattern: outputs/wave5/evidence_patient_shuffle/seed{seed}_patient_shuffle.csv
  query_registry: outputs/wave5/queries/wave5_frozen_queries.csv
  output_dir: outputs/wave5b

columns:
  hgt_probability: p_hgt_calibrated
  hcr_probability: p_hcr2_calibrated
  patient_shuffle_probability: p_patient_shuffle_calibrated
  uncertainty: hcr_uncertainty

graph_selection:
  # Frozen Wave 5A.1 thresholds — not re-tuned here.
  hgt_threshold: 0.50
  hcr_threshold: 0.50
  patient_shuffle_threshold: 0.50
  keep_all_train_edges: true
  require_topological_allowed_for_predicted: true

energy:
  temperatures:
    - 0.5
    - 0.75
    - 1.0
    - 1.5
    - 2.0
  length_penalties:
    - 0.0
    - 0.025
    - 0.05
    - 0.1
  uncertainty_penalties:
    - 0.0
    - 0.25
    - 0.5

evaluation:
  top_k: 100
  report_k:
    - 1
    - 5
    - 10
  tune_split: valid
  final_split: test

hub_definition:
  degree_quantile: 0.90
