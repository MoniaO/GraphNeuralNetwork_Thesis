# Wave 5 — finite ensemble with HGT edge potentials only (W3)
enabled: true
name: hgt_finite

graph:
  source: predicted
  enforce_dag: true
  endpoint_terminal: true
  candidate_threshold: 0.50
  candidate_budget: null
  # Filter predicted edges by HGT-calibrated probability (not HCR-2).
  probability_column: p_hgt_calibrated

path:
  top_k: 20
  temperature: 1.0
  length_penalty: 0.10
  max_hops: null

edge_potential:
  mode: nested_probabilities
  alpha_hgt: 1.0
  beta_hcr2: 0.0
  beta_hcr3: 0.0
  uncertainty_penalty: 0.0
  known_edge_probability: 0.999999
  calibration: platt

motifs:
  enabled: false

patient_context:
  enabled: false

temporal:
  enabled: false
