# Patient-conditioned WNERW (Stage 5)
enabled: true
name: patient_conditioned

graph:
  source: predicted
  enforce_dag: true
  endpoint_terminal: true
  candidate_threshold: 0.50
  candidate_budget: null

path:
  top_k: 20
  temperature: 1.0
  length_penalty: 0.10
  max_hops: null

edge_potential:
  mode: nested_probabilities
  alpha_hgt: 1.0
  beta_hcr2: 1.0
  beta_hcr3: 1.0
  uncertainty_penalty: 0.0
  known_edge_probability: 0.999999
  calibration: platt

motifs:
  enabled: true
  order: 3
  mode: soft
  coefficient: 1.0
  inactive_penalty: 5.0

patient_context:
  enabled: true
  source_prior: uniform
  root_name: patient_root

temporal:
  enabled: false
