# Wave 5B control — shuffle D1 probs among predicted edges.
enabled: true
name: shuffled_d1

graph:
  source: predicted
  enforce_dag: true
  endpoint_terminal: true
  candidate_threshold: 0.50
  candidate_budget: null
  probability_column: p_d1_calibrated

path:
  top_k: 20
  temperature: 1.0
  length_penalty: 0.10
  max_hops: null

edge_potential:
  mode: d1_log_prob
  shuffle_hcr: true
  known_edge_probability: 0.999999
  uncertainty_penalty: 0.0
  calibration: platt

motifs:
  enabled: false

patient_context:
  enabled: false

temporal:
  enabled: false
