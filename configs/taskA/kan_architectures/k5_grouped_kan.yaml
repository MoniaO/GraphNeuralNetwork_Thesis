hcr: w7c_b2_audit
model: TaskA_hgt_wave7c
hgt:
  num_layers: 3
  heads: 8
  hidden_dim: 32
  activation: leaky_relu
  residual: true
  dropout: 0.2
decoder:
  arch: unshared_mlp
  ablation: none
  use_triple: false
  ag_kan_residual:
    enabled: false
  pair_encoder:
    type: grouped_kan
    input_dim: 40
    hidden_dim: 16
    output_dim: 8
    dropout: 0.1
    spline_order: 3
    grid_size: 5
    grid_range:
    - -3.0
    - 3.0
    grid_update: false
    base_activation: silu
    base_scale_init: 1.0
    spline_scale_init: 0.1
    use_bias: true
    spline_l1: 1.0e-05
    layernorm: true
    activation: gelu
    gate_init_logit: -3.0
training:
  epochs: 200
  early_stopping_patience: 40
  grad_clip: 1.0
  device: cpu
model_id: TA_GROUPED_KAN
variant: TA_GROUPED_KAN
pair_encoder_type: grouped_kan
