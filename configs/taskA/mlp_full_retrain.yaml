# Task A — TA_MLP full retrain (source of truth: W7D_T0_A1 / W9_K0)
#
# Runner applies these as Hydra overrides to train_taskA.py.
# Only pair_encoder.type differs vs kan_full_retrain.yaml.

model_id: TA_MLP
variant: TASKA_MLP_FULL_RETRAIN
pair_encoder_type: mlp

inherits_from: W7D_T0_A1_UNSHARED_ROLE_ENCODERS
hcr: w7c_b2_audit
model: TaskA_hgt_wave7c

hgt:
  num_layers: 3
  heads: 8
  hidden_dim: 32
  activation: leaky_relu
  residual: true
  dropout: 0.2

decoder:
  arch: unshared_mlp
  ablation: none
  use_triple: false
  # classical4 residual is NOT part of frozen A1 (Wave7C decoder).
  pair_encoder:
    type: mlp
    input_dim: 40
    hidden_dim: 16
    output_dim: 8
    dropout: 0.1   # exact A1 / W9 control (not HGT dropout)
    activation: gelu
    layernorm: true

training:
  epochs: 200
  early_stopping_patience: 40
  grad_clip: 1.0
  selection_metric: auprc
  device: cpu

ag_kan_residual_enabled: false
use_cmi: false
init_from_checkpoint: null
