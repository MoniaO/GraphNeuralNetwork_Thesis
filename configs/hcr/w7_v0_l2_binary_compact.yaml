# Wave 7 V0 — benchmark: legacy L2 structural binary_compact.
# Motif (honest name): AZ⊕AG⊕ZG = candidate_coparent_triangle (same as frozen L2).
enabled: true
encoder: generalized_hcr
variant: W7_V0_L2_BINARY_COMPACT
pair_dim: 8
motif_dim: 24
motif_type: candidate_coparent_triangle
roles:
  - AZ
  - AG
  - ZG
output_dim: 24
smoothing: 0.5
fit_split: train
fit_scope: train_only
unsupported_pair_mode: zeros
unknown_pair_value: 0.0
force_zero_features: false
append_supported_mask: false
min_complete: 50
min_level_count: 5
