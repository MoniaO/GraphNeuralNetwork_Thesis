# Wave 7 V1 — clean GHCR one-hot orthonormal contrast for binary–binary only.
# Motif identical to V0: AZ⊕AG⊕ZG (only the pair encoding changes).
enabled: true
encoder: generalized_hcr
variant: W7_V1_GHCR_BINARY_ONEHOT
pair_dim: 8
motif_dim: 24
motif_type: candidate_coparent_triangle
roles:
  - AZ
  - AG
  - ZG
output_dim: 24
# Clean V1: no additive smoothing in orthonormal bases (ablate separately).
smoothing: 0.0
v1_smoothing: 0.0
fit_split: train
fit_scope: train_only
unsupported_pair_mode: zeros
min_complete: 50
min_level_count: 5
bootstrap_seed: 20260722

binary:
  representation: one_hot
  basis: weighted_gram_schmidt
  drop_constant_direction: true
  smoothing: 0.0

uncertainty:
  method: bootstrap
  target: a11
  # Controlled Wave 7 V1: always 30. V1b (10 reps) is a separate ablation.
  repeats: 30

energy:
  use_all_coefficients: true
