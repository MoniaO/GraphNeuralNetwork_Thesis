# HCR-3 full: pairwise + a111 + conditional blocks (16-d).
# Z is supplied per candidate by the Wave 3B attach path (oracle co-parent).
enabled: true
variant: hcr3_full
output_dim: 17
smoothing: 0.5
fit_split: train
unsupported_pair_mode: zeros
unknown_pair_value: 0.0
force_zero_features: false
append_supported_mask: false
include_a111: true
z_mode: oracle_coparent
