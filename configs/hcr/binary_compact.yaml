# HCR-1: compact binary–binary dependence vector (8-d).
enabled: true
variant: binary_compact
output_dim: 8
smoothing: 0.5
fit_split: train
unsupported_pair_mode: zeros
unknown_pair_value: 0.0
force_zero_features: false
# Stage-2+ control: append m_uv so zeros ≠ unsupported.
# Keep false for stage-1/2 main comparison; enable with hcr.append_supported_mask=true.
append_supported_mask: false

features:
  p11: true
  conditional_probability: true
  risk_difference: true
  log_odds_ratio: true
  phi: true
  mutual_information: true
  joint_support_rate: true
  uncertainty: true
